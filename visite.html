<style>

.card{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
#brand{position:fixed;left:16px;top:16px;padding:12px 16px;z-index:5;max-width:60vw}
#brand .tag{font-size:10px;letter-spacing:.18em;color:var(--red);font-weight:700;text-transform:uppercase}
